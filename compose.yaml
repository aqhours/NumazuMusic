name: numazumusic

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: aqhours-numazumusic:latest
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      aqhours-web:
        aliases:
          - numazumusic-app
    labels:
      - com.aqhours.service=numazumusic

networks:
  aqhours-web:
    external: true

