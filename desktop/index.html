<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NumazuMusic</title>
    <script>
      if (location.hash === "#/overlay") document.documentElement.dataset.overlay = "true";
      else { try { document.documentElement.dataset.theme = localStorage.getItem("numazumusic-theme") === "light" ? "light" : "dark"; } catch {} }
    </script>
    <style>html[data-overlay="true"],html[data-overlay="true"] body { background: transparent !important; }</style>
  </head>
  <body><div id="root"></div><script type="module" src="/main.tsx"></script></body>
</html>
