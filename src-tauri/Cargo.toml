[package]
name = "numazumusic"
version = "0.1.0"
description = "NumazuMusic desktop lyric reader"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }

